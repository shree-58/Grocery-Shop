
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Basket | Grocery Store</title>
    <link rel="stylesheet" href="sttyyle.css">
</head>
<body>

<header>
    <div class="logo">🥬 Fresh Basket</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#categories">Categories</a>
        <a href="#products">Products</a>
    </nav>
    <button class="cart-btn" onclick="toggleCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </button>
</header>

<section class="hero" id="home">
    <h1><i>Fresh Groceries, Happy Living!</i></h1>
    <p><i>Everything you need, all in one place.</i></p>
    <a href="#products" class="shop-btn">Shop Now</a>
</section>

<section class="search-section">
    <input type="text" id="search"
    placeholder="Search your favourite products..."
    oninput="displayProducts()">
</section>

<section id="categories">
    <h2>Shop By Category</h2>
    <div class="category-list">
        <button onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('Fruits')">🍎 Fruits</button>
        <button onclick="filterCategory('Vegetables')">🥕 Vegetables</button>
        <button onclick="filterCategory('Dairy')">🥛 Dairy</button>
        <button onclick="filterCategory('Grains')">🌾 Grains</button>
        <button onclick="filterCategory('Bakery')">🍞 Bakery</button>
        <button onclick="filterCategory('Snacks')">🍪 Snacks</button>
        <button onclick="filterCategory('Beverages')">🧃 Beverages</button>
        <button onclick="filterCategory('Household')">🧹 Household</button>
    </div>
</section>

<section id="products">
    <h2>Our Grocery Products</h2>
    <div id="product-container" class="product-grid"></div>
</section>

<div id="cart-panel" class="cart-panel">
    <button class="close-btn" onclick="toggleCart()">✖</button>
    <h2>My Shopping Cart 🛒</h2>
    <div id="cart-items"></div>
    <h3>Total: ₹<span id="cart-total">0</span></h3>
    <button class="checkout-btn" onclick="checkout()">Place Order</button>
</div>

<footer>
    <h3>🥬 Fresh Basket</h3>
    <p>Your daily needs, delivered with freshness.</p>
    <p>© 2026 Fresh Basket. All Rights Reserved.</p>
</footer>

<script src="scrippt.js"></script>
</body>
</html>
